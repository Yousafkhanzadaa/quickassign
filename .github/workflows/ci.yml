name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for every job; actions are pinned to full commit SHAs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (typecheck, tests, web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qa/core build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @qa/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [gateway, sandbox]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go mod verify
      - run: go vet ./...
      # Includes TestOnlyOutboundSends: nothing but outbound.go may send WhatsApp messages.
      - run: go test ./...

  database:
    name: Database security tests (RLS, grants, billing)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: quickassign
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d quickassign"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Throwaway credentials for the CI service container only.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-secret
      POSTGRES_USER: postgres
      POSTGRES_DB: quickassign
      QA_OWNER_PASSWORD: ci-owner
      QA_QUEUE_PASSWORD: ci-queue
      QA_WEB_PASSWORD: ci-web
      QA_WORKER_PASSWORD: ci-worker
      QA_GATEWAY_PASSWORD: ci-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qa/core build && pnpm --filter @qa/worker build
      - name: Create roles (same script as local development)
        run: bash db/init/00-roles.sh
      - name: Apply migrations as qa_owner
        run: node apps/worker/dist/migrate.js
        env:
          OWNER_DATABASE_URL: postgres://qa_owner:ci-owner@localhost:5432/quickassign
          QUEUE_DATABASE_URL: postgres://qa_queue:ci-queue@localhost:5432/quickassign
          MIGRATIONS_DIR: db/migrations
      - run: psql -v ON_ERROR_STOP=1 -d quickassign -f db/tests/schema_test.sql
      - run: psql -v ON_ERROR_STOP=1 -d quickassign -f db/tests/billing_test.sql

  images:
    name: Docker images (build + in-image tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/gen-env.sh
      - run: docker compose build

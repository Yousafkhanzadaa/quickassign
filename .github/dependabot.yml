version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directories: ["/gateway", "/sandbox"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/gateway", "/sandbox", "/apps/web", "/apps/worker"]
    schedule:
      interval: weekly
